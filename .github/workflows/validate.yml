name: Validate pack

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pinned capability-router test dependency
        run: python -m pip install -r tests/requirements-capability-router.txt
      - name: Validate pack and source contracts
        shell: pwsh
        run: ./scripts/validate-pack.ps1
      - name: Test redacted secret-scanner result gate
        run: python -B -m unittest tests.test_trufflehog_result_gate -v
      - name: Validate JSON Schema support
        shell: pwsh
        run: ./tests/json-schema-validation-smoke.ps1
      - name: Build deterministic release package
        shell: pwsh
        run: |
          $First = "$env:RUNNER_TEMP/codex-coding-os-first.zip"
          $Second = "$env:RUNNER_TEMP/codex-coding-os-second.zip"
          ./scripts/package.ps1 -OutputPath $First
          ./scripts/package.ps1 -OutputPath $Second
          $FirstHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $First).Hash
          $SecondHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Second).Hash
          if ($FirstHash -ne $SecondHash) {
            throw "Repeated release archives are not deterministic."
          }

  product-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test campaign model and reducer
        run: python -B -m unittest tests.test_campaign_model_reducer -v
      - name: Test reducer mutation-gate receipt evaluation
        run: python -B -m unittest tests.test_reducer_mutation_gate -v
      - name: Install pinned fork-based mutation runner
        run: python -m pip install mutmut==3.7.0
      - name: Reject surviving critical reducer mutations
        run: python -B scripts/run_reducer_mutation_gate.py --max-children 2
      - name: Check reducer-to-formal lifecycle conformance
        run: python -B -m unittest tests.test_campaign_formal_conformance -v
      - name: Test pinned TLC runner
        run: python -B -m unittest tests.test_campaign_tlc_runner -v
      - name: Install the pinned TLC Java runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Model-check bounded campaign lifecycle with TLC
        run: python ./scripts/run_campaign_tlc.py --download --jar "${{ runner.temp }}/tla2tools-v1.7.4.jar"
      - name: Test campaign store
        run: python -B -m unittest tests.test_campaign_store -v
      - name: Test campaign runtime components
        run: python -B -m unittest tests.test_campaign_runtime_components -v
      - name: Test deterministic campaign supervisor
        run: python -B -m unittest tests.test_campaign_supervisor -v
      - name: Replay campaign incidents and cross-layer conformance
        run: python -B -m unittest tests.test_campaign_incident_conformance -v
      - name: Test executable campaign CLI
        run: python -B -m unittest tests.test_campaign_cli -v

  product-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pinned capability-router test dependency
        run: python -m pip install -r tests/requirements-capability-router.txt
      - name: Test transactional install contract
        run: python -B tests/test_install_transaction.py
      - name: Test canonical router and security capability contracts
        run: >-
          python -B -m unittest
          tests.test_repository_capability_router
          tests.test_capability_manifest_recovery
          tests.test_catalogue_router_wrapper
          tests.test_security_capability_routing
          tests.test_local_security_skill_parity
          tests.test_plugin_manifest_boundaries
          -v
      - name: Smoke test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install-uninstall-smoke.ps1
      - name: Test transactional hard-crash recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install-transaction-faults.ps1
      - name: Check bash installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n ./scripts/install.sh ./scripts/uninstall.sh ./tests/install-uninstall-smoke.sh
      - name: Smoke test bash install and uninstall
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./tests/install-uninstall-smoke.sh

  requested-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test public installer documentation contract
        run: python -B tests/test_public_install_docs.py
      - name: Test documentation artifact contracts
        run: python -B tests/test_documentation_contracts.py
      - name: Test project artifact instances and triggers
        run: python -B tests/test_project_artifact_instances.py

  coding-os-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test source-only campaign adapter contracts
        run: python -B tests/test_source_repository_profile.py

  pr-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Self-test pull request metadata contract
        run: python ./scripts/check-pr-body.py --self-test
      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        run: python ./scripts/check-pr-body.py

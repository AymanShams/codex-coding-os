name: Validate pack

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned capability-router test dependency
        run: python -m pip install -r capability-routing/requirements-test.txt
      - name: Test redacted secret-scanner result gate
        run: python -B -m unittest tests.test_trufflehog_result_gate -v
      - name: Validate JSON Schema support
        shell: pwsh
        run: ./tests/json-schema-validation-smoke.ps1
      - name: Build deterministic release package
        shell: pwsh
        # package.ps1 validates once and compares two independently built archives.
        run: ./scripts/package.ps1 -OutputPath "$env:RUNNER_TEMP/codex-coding-os.zip"

  product-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the validation boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor
          bash scripts/prepare_linux_validation_boundary.sh
      - name: Test campaign model and reducer
        run: python -B -m unittest tests.test_campaign_model_reducer -v
      - name: Test reducer mutation-gate receipt evaluation
        run: python -B -m unittest tests.test_reducer_mutation_gate -v
      - name: Install pinned fork-based mutation runner
        run: python -m pip install mutmut==3.7.0
      - name: Reject surviving critical reducer mutations
        run: python -B scripts/run_reducer_mutation_gate.py --max-children 2
      - name: Check reducer-to-formal lifecycle conformance
        run: python -B -m unittest tests.test_campaign_formal_conformance -v
      - name: Test pinned TLC runner
        run: python -B -m unittest tests.test_campaign_tlc_runner -v
      - name: Install the pinned TLC Java runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Model-check bounded campaign lifecycle with TLC
        run: python ./scripts/run_campaign_tlc.py --download --jar "${{ runner.temp }}/tla2tools-v1.7.4.jar"
      - name: Test campaign store
        run: python -B -m unittest tests.test_campaign_store -v
      - name: Test campaign runtime components
        run: python -B -m unittest tests.test_campaign_runtime_components -v
      - name: Test deterministic campaign supervisor
        run: python -B -m unittest tests.test_campaign_supervisor -v
      - name: Replay campaign incidents and cross-layer conformance
        run: python -B -m unittest tests.test_campaign_incident_conformance -v
      - name: Test executable campaign CLI
        run: python -B -m unittest tests.test_campaign_cli -v
      - name: Test bounded delivery and usage accounting
        run: >-
          python -B -m unittest tests.test_campaign_bounded_continuation
          tests.test_campaign_provider_usage tests.test_campaign_validation_boundary
          tests.test_campaign_acceptance_sources -v
      - name: Exercise public installation in a disposable account namespace
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          candidate="$(git rev-parse HEAD)"
          baseline="$(git rev-parse HEAD^)"
          journey="$RUNNER_TEMP/supported-install-journey"
          mkdir -p "$journey/output"
          git archive --format=zip --output="$journey/baseline.zip" "$baseline"
          git archive --format=zip --output="$journey/candidate.zip" "$candidate"
          account_profile="$(python3 -c 'import os,pwd; print(pwd.getpwuid(os.getuid()).pw_dir)')"
          bwrap --unshare-user --uid "$(id -u)" --gid "$(id -g)" --ro-bind / / \
            --tmpfs "$account_profile" --tmpfs /tmp --proc /proc --dev /dev \
            --bind "$journey/output" /var/tmp --setenv HOME "$account_profile" --unsetenv CODEX_HOME --unsetenv SKILLS_ROOT \
            --unsetenv PYTHONPATH --setenv PYTHONDONTWRITEBYTECODE 1 \
            python3 -B "$PWD/tests/supported_install_journey.py" \
            --baseline-archive "$journey/baseline.zip" --baseline-commit "$baseline" \
            --candidate-archive "$journey/candidate.zip" --candidate-commit "$candidate"

  product-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Linux validation boundary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor
          bash scripts/prepare_linux_validation_boundary.sh
      - name: Install pinned Windows validation boundary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $BoundaryRoot = Join-Path $env:RUNNER_TEMP 'codex-boundary'
          New-Item -ItemType Directory -Path $BoundaryRoot | Out-Null
          gh release download rust-v0.154.0 --repo openai/codex --pattern codex-package-x86_64-pc-windows-msvc.tar.gz --pattern codex-package_SHA256SUMS --dir $BoundaryRoot
          if ($LASTEXITCODE -ne 0) { throw 'Codex boundary download failed.' }
          $Archive = Join-Path $BoundaryRoot 'codex-package-x86_64-pc-windows-msvc.tar.gz'
          $Checksum = Get-Content (Join-Path $BoundaryRoot 'codex-package_SHA256SUMS') | Where-Object { $_ -match ' codex-package-x86_64-pc-windows-msvc.tar.gz$' }
          $Expected = ($Checksum -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Expected) { throw 'Codex boundary checksum mismatch.' }
          tar -xzf $Archive -C $BoundaryRoot
          if ($LASTEXITCODE -ne 0) { throw 'Codex boundary extraction failed.' }
          $Binary = @(Get-ChildItem -LiteralPath $BoundaryRoot -Recurse -Filter codex.exe)
          if ($Binary.Count -ne 1) { throw 'Expected exactly one Codex binary.' }
          $BoundaryCodexHome = Join-Path $env:USERPROFILE '.codex'
          & $Binary[0].FullName sandbox setup --elevated --current-user --codex-home $BoundaryCodexHome
          if ($LASTEXITCODE -ne 0) { throw 'Windows validation sandbox provisioning failed.' }
          $Binary[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Verify validation containment and accepted local delivery
        run: python -B -m unittest tests.test_campaign_validation_boundary tests.test_campaign_bounded_continuation -v
      - name: Install pinned capability-router test dependency
        run: python -m pip install -r capability-routing/requirements-test.txt
      - name: Test transactional install contract
        run: python -B tests/test_install_transaction.py
      - name: Test canonical router and security capability contracts
        run: >-
          python -B -m unittest
          tests.test_repository_capability_router
          tests.test_capability_manifest_recovery
          tests.test_capability_manifest_builder
          tests.test_catalogue_router_wrapper
          tests.test_security_capability_routing
          tests.test_local_security_skill_parity
          tests.test_plugin_manifest_boundaries
          -v
      - name: Smoke test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install-uninstall-smoke.ps1
      - name: Test transactional hard-crash recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install-transaction-faults.ps1
      - name: Check bash installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n ./scripts/install.sh ./scripts/uninstall.sh ./tests/install-uninstall-smoke.sh
      - name: Smoke test bash install and uninstall
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./tests/install-uninstall-smoke.sh

  requested-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test public installer documentation contract
        run: python -B tests/test_public_install_docs.py
      - name: Test documentation artifact contracts
        run: python -B tests/test_documentation_contracts.py
      - name: Test project artifact instances and triggers
        run: python -B tests/test_project_artifact_instances.py
      - name: Check founder entry fixtures and documentation boundaries
        run: python -B -m unittest tests.test_founder_entry_fixtures -v

  coding-os-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test source-only campaign adapter contracts
        run: python -B tests/test_source_repository_profile.py

  pr-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test pull request metadata contract
        run: python ./scripts/check-pr-body.py --self-test
      - name: Test manual and campaign metadata boundaries
        run: python -B -m unittest tests.test_pr_body -v
      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        run: python ./scripts/check-pr-body.py
